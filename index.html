<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHM Hello World</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/style.css">
    <style>
      #err-banner{position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;font:12px/1.4 monospace;padding:8px;z-index:99999;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;display:none}
      #boot-status{position:fixed;bottom:0;left:0;right:0;background:#222;color:#0f0;font:11px/1.3 monospace;padding:6px;z-index:99998;white-space:pre-wrap}
    </style>
</head>
<body>
    <div id="err-banner"></div>
    <div id="app"></div>
    <div id="boot-status">boot: html loaded</div>
    <script>
      (function(){
        var st = document.getElementById('boot-status');
        var eb = document.getElementById('err-banner');
        function log(m){ if(st) st.textContent += '\n' + m; }
        function fail(m){ if(eb){ eb.style.display='block'; eb.textContent += m + '\n\n'; } log('ERR: ' + m); }
        window.__ahmLog = log;
        window.addEventListener('error', function(e){
          fail((e.filename||'?') + ':' + (e.lineno||'?') + '  ' + (e.message||e));
        });
        window.addEventListener('unhandledrejection', function(e){
          var r = e.reason || {};
          fail('Promise: ' + (r.stack || r.message || r));
        });
        log('boot: error handlers attached');
      })();
    </script>
    <script type="importmap">
    {
      "imports": {
        "vue": "./src/lib/vue/vue.esm-browser.prod.js",
        "vue-router": "./src/lib/vue-router/vue-router.esm-browser.js"
      }
    }
    </script>
    <script type="module">
      window.__ahmLog && window.__ahmLog('boot: module script starting');
      import('./src/main.sfc.js')
        .then(function(){ window.__ahmLog && window.__ahmLog('boot: main.sfc.js loaded'); })
        .catch(function(e){
          var eb = document.getElementById('err-banner');
          if(eb){ eb.style.display='block'; eb.textContent = 'Import failed:\n' + (e.stack || e.message || e); }
        });
    </script>
</body>
</html>
